name: Android Manual Build

on:
  workflow_dispatch: # يضمن أن البناء يعمل يدوياً فقط عند الضغط على الزر

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Stable APK
        run: ./gradlew assembleStableDebug # يبني نسخة الـ stable فقط

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Temu-App-Stable
          path: app/build/outputs/apk/stable/debug/*.apk # يجلب ملف الـ APK فقط

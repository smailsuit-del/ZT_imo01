buildscript {
    // تحديث إصدار Kotlin ليتوافق مع Compose
    ext.kotlinVersion = '1.9.24' 
    repositories {
        google()
        mavenCentral() // تم استبدال jcenter هنا
    }
    dependencies {
        // تحديث Android Gradle Plugin ليدعم الميزات الحديثة
        classpath 'com.android.tools.build:gradle:8.5.2' 
        classpath 'com.getkeepsafe.dexcount:dexcount-gradle-plugin:4.0.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'com.github.ben-manes:gradle-versions-plugin:0.51.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral() // تم استبدال jcenter هنا
        maven { url "https://jitpack.io" }
    }
}

ext {
    // تحديث الحد الأدنى والأقصى لإصدارات أندرويد لتتوافق مع المكتبات الحديثة
    minSdkVersion = 21 
    targetSdkVersion = 34 
    compileSdkVersion = 34 
}
